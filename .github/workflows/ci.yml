name: CI
on: [pull_request]
jobs:
  tests:
    name: Searchable (PHP ${{ matrix.php-versions }} / ORC ${{ matrix.orchestra-versions }} )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: [ '8.5', '8.4', '8.3', '8.2' ]
        orchestra-versions: [ '11.0', '10.0', '9.0' ]
        exclude:
          # Laravel 13 (Testbench 11) requires PHP >= 8.3
          - php-versions: 8.2
            orchestra-versions: 11.0
          # Laravel 11 (Testbench 9) does not support PHP 8.5
          - php-versions: 8.5
            orchestra-versions: 9.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, dom, fileinfo, gmp, bcmath

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Remove composer.lock
        run: rm -f composer.lock

      - name: Remove QA dependencies
        run: composer remove laravel/pint phpstan/phpstan --dev --no-update

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Test with phpunit
        run: composer test
